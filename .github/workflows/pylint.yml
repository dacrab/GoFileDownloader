name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - run: pip install -r requirements.txt pylint

      - run: python -m pylint $(git ls-files '*.py')
